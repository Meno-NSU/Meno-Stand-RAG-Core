[project]
name = "meno-rag-backend"
version = "0.1.0"
description = "Production-oriented backend for the Meno stand RAG pipeline."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "bm25s>=0.2.13",
    "faiss-cpu>=1.8.0",
    "fastapi>=0.115.0",
    "greenlet>=3.1.0",
    "httpx>=0.28.0",
    "nltk>=3.9.0",
    "numpy>=1.26.0",
    "openai>=1.90.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.8.0",
    "python-dotenv>=1.0.0",
    "razdel>=0.5.0",
    "redis>=5.2.0",
    "scipy>=1.13.0",
    "sqlalchemy>=2.0.0",
    "structlog>=24.4.0",
    "torch>=2.4.0",
    "transformers>=4.45.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
meno-rag-api = "meno_rag.api.main:run"
meno-rag-migrate = "meno_rag.db.migrate:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "fakeredis>=2.26.0",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "meno_rag"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
